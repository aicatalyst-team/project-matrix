apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: layerdeployments.project-matrix.redhat.com
  labels:
    app.kubernetes.io/part-of: project-matrix
    project-matrix.redhat.com/layer: gateway
    project-matrix.redhat.com/code-name: gatekeeper
spec:
  group: project-matrix.redhat.com
  scope: Namespaced
  names:
    plural: layerdeployments
    singular: layerdeployment
    kind: LayerDeployment
    shortNames:
    - ldep
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Layer
      type: string
      jsonPath: .spec.layer
    - name: Mode
      type: string
      jsonPath: .spec.mode
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - layer
            - codeName
            - mode
            - desiredState
            properties:
              layer:
                type: string
              codeName:
                type: string
              mode:
                type: string
                enum:
                - Production
                - Preview
              desiredState:
                type: string
                enum:
                - Enabled
                - Disabled
              profile:
                type: string
              customerProfile:
                type: string
              coexistence:
                type: object
                properties:
                  enabled:
                    type: boolean
                  retainInactiveLane:
                    type: boolean
          status:
            type: object
            properties:
              phase:
                type: string
              activeMode:
                type: string
              evidenceRef:
                type: string
              supportBoundary:
                type: string
              conditions:
                type: array
                items:
                  x-kubernetes-preserve-unknown-fields: true
                  type: object
