apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-matrix-dashboard-bff
  namespace: matrix-system
  labels:
    app.kubernetes.io/name: project-matrix-dashboard-bff
    app.kubernetes.io/part-of: project-matrix
    project-matrix.redhat.com/component: dashboard-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: project-matrix-dashboard-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-matrix-dashboard-bff
        app.kubernetes.io/part-of: project-matrix
        project-matrix.redhat.com/component: dashboard-bff
    spec:
      serviceAccountName: project-matrix-dashboard-bff
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard-bff
        image: image-registry.openshift-image-registry.svc:5000/project-matrix-build/project-matrix-dashboard@sha256:ae40b0d64b15d6f377fe3687b58223338a4d6ae87bf40024e1f0e2020e73945d
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8082
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: project-matrix-dashboard-bff
  namespace: matrix-system
  labels:
    app.kubernetes.io/name: project-matrix-dashboard-bff
    app.kubernetes.io/part-of: project-matrix
    project-matrix.redhat.com/component: dashboard-bff
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-matrix-dashboard-bff
  ports:
  - name: http
    port: 8082
    targetPort: http
