# Internal tools/call authorization contract for the named `mcps` listener.
#
# The router's authenticated hairpin carries `router-key`; that internal path
# is intentionally exempt because the gateway/router owns that trust boundary.
# Any direct request to the internal listener without router-key must still
# present a valid OpenShift bearer token. This is the OpenShift-native proof
# lane; customer OIDC/tool-role authorization remains a separate qualification
# step and can be supplied through an AuthPolicy targeting the same listener.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcps-auth-policy
  namespace: mcp-gateway-system
  labels:
    project-matrix.redhat.com/component: gatekeeper
    project-matrix.redhat.com/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcps
  when:
    - predicate: "!request.headers.exists(h, h == 'router-key')"
  rules:
    authentication:
      openshift-oauth:
        kubernetesTokenReview:
          audiences:
            - https://kubernetes.default.svc
    response:
      unauthenticated:
        code: 401
        headers:
          WWW-Authenticate:
            value: Bearer
        body:
          value: '{"error":"Unauthorized","message":"Authentication required."}'
      unauthorized:
        code: 403
        body:
          value: '{"error":"Forbidden","message":"Access denied."}'
